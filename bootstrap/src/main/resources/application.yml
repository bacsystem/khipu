spring:
  application:
    name: khipu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factura}
    username: ${DB_USER:factura}
    password: ${DB_PASSWORD:factura}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      # El único multipart del sistema es el .p12 del certificado, y trae la clave privada del emisor. Con el
      # umbral por defecto (0B) Tomcat escribe toda parte subida a un archivo temporal en claro antes de que el
      # controlador la lea; con el umbral por encima del tope máximo se queda en memoria y nunca toca el disco.
      file-size-threshold: 2MB
      max-file-size: 1MB
      max-request-size: 2MB
server:
  port: ${PORT:8001}
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  health:
    # Sigue a app.mail.habilitado (la misma propiedad que elige SmtpCorreoSender o LogCorreoSender), no a
    # la variable de entorno suelta: así el indicador no puede quedar apagado mientras la app sí manda
    # correo. Con el correo apagado no hay SMTP que comprobar y el indicador dejaría /health en DOWN para
    # siempre, que es un falso rojo y no una señal.
    mail:
      enabled: ${app.mail.habilitado}
  endpoint:
    health:
      group:
        # Para el healthcheck de la plataforma (Railway y similares): solo lo que hace al servicio
        # inutilizable. Con el correo habilitado, un SMTP roto sí sale en `/health` completo, pero no
        # debe tumbar el despliegue.
        liveness:
          include: db, ping
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui
app:
  mode: ${APP_MODE:multi}
  master-key: ${MASTER_KEY:}
  api-key-pepper: ${API_KEY_PEPPER:}
  # S2: para rotar. La de antes, mientras se termina de recifrar (MASTER_KEY) o de re-hashear las keys en uso (API_KEY_PEPPER). Vacías: no se está rotando.
  master-key-anterior: ${MASTER_KEY_ANTERIOR:}
  api-key-pepper-anterior: ${API_KEY_PEPPER_ANTERIOR:}
  platform-admin-key: ${PLATFORM_ADMIN_KEY:}
  jwt-secret: ${JWT_SECRET:}
  portal-url: ${PORTAL_URL:http://localhost:3000}
  # Cerrado por defecto (issue #174): el portal ya cerraba su propia ruta de registro, pero el backend la dejaba
  # abierta a quien lo llamara directo. Abrirlo es una decisión explícita de despliegue, no el estado de reposo.
  registro-abierto: ${REGISTRO_ABIERTO:false}
  # IP del cliente detrás de proxies (#208). Expresión regular de las IPs de los proxies de los que se acepta `X-Forwarded-For`
  # (p. ej. el BFF del portal). Vacío por defecto: no se confía en la cabecera y se registra la IP de la conexión. Se calibra con
  # `GET /v1/admin/origen`; ver deploy/README.md. Ver ProxyDeConfianzaConfig.
  trusted-proxies: ${TRUSTED_PROXIES:}
  # Vida de la sesión del administrador del backoffice, en minutos (#177): entre 5 y 60, o el arranque aborta. Sin refresh: al vencer
  # se vuelve a entrar con contraseña y segundo factor.
  admin-sesion-minutos: ${ADMIN_SESION_MINUTOS:30}
  storage:
    type: ${STORAGE_TYPE:fs}
    fs-root: ${STORAGE_FS_ROOT:./storage}
    # STORAGE_TYPE=s3 (#38): S3 o compatible (MinIO, Backblaze B2, Cloudflare R2). Sin endpoint → AWS; sin access-key → cadena de credenciales por defecto.
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:us-east-1}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style: ${STORAGE_S3_PATH_STYLE:false}
  integridad:
    dias: ${INTEGRIDAD_DIAS:7}
    intervalo-ms: ${INTEGRIDAD_INTERVALO_MS:86400000}
  monitor:
    # #362 B14: horas que un resumen diario o una baja con ticket puede llevar sin respuesta de SUNAT antes de que el monitor del backoffice lo marque (1 a 168). El worker no
    # se rinde nunca con un ticket (lo reconsulta con intervalo creciente, hasta cada 5 min): esto solo avisa, no cambia lo que hace.
    resumen-sin-respuesta-horas: ${MONITOR_RESUMEN_SIN_RESPUESTA_HORAS:6}
  sunat:
    timeout-seconds: ${SUNAT_TIMEOUT_SECONDS:15}
    beta-url: https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
    prod-url: https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService
    # Consultas (#36): billConsultService (estado y CDR) y billValidService (validez); solo existen en producción.
    consulta-url: https://e-factura.sunat.gob.pe/ol-it-wsconscpegem/billConsultService
    consulta-beta-url: ${SUNAT_CONSULTA_BETA_URL:}
    validez-url: https://e-factura.sunat.gob.pe/ol-it-wsconsvalidcpe/billValidService
    validez-beta-url: ${SUNAT_VALIDEZ_BETA_URL:}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:10000}
    max-intentos: ${OUTBOX_MAX_INTENTOS:20}
  # Padrón reducido de SUNAT (#361): ~18 millones de contribuyentes (RUC, razón social, estado, condición y domicilio). SUNAT lo renueva cada día; la carga baja ~400 MB y
  # escribe la base, por eso está apagada por defecto. La consulta GET /v1/consultas/ruc/{ruc} responde 503 PADRON_NO_CARGADO hasta que corra la primera.
  padron-ruc:
    habilitado: ${PADRON_RUC_HABILITADO:false}
    # URL de la descarga pública (.zip) o ruta de un archivo local (.zip o .txt, ISO-8859-1).
    origen: ${PADRON_RUC_ORIGEN:https://www2.sunat.gob.pe/padron_reducido_ruc.zip}
    # Cron de Spring, hora de Lima. SUNAT publica de madrugada.
    cron: ${PADRON_RUC_CRON:0 30 4 * * *}
    limite-de-descarga-minutos: ${PADRON_RUC_LIMITE_DESCARGA_MINUTOS:30}
    # Filas mínimas de la PRIMERA carga (después se exige el 90 % de la anterior): un archivo de miles es una descarga equivocada, no el padrón.
    minimo-primera-carga: ${PADRON_RUC_MINIMO_PRIMERA_CARGA:1000000}
  mail:
    habilitado: ${MAIL_HABILITADO:false}
    remitente: ${MAIL_REMITENTE:no-responder@khipu.pe}
  zona-horaria: America/Lima
  # SOLO PARA PRUEBAS (#363). Duración ISO-8601 que se suma al reloj del backend para reproducir plazos que dependen de la fecha (-P8D = ocho días
  # antes). Vacío = hora real. Con valor la app no arranca si hay empresas en PRODUCCION, no opera con las que pasen a serlo y deja un WARN al arrancar.
  # Qué se mueve y qué no: deploy/README.md §10.
  reloj-desplazamiento: ${RELOJ_DESPLAZAMIENTO:}
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  # Con usuario y clave vacíos, Spring no autentica: contra un SMTP sin credenciales (Mailpit en local) hay que poner
  # MAIL_SMTP_AUTH=false. Por defecto sigue siendo true, como en producción.
  properties.mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
  properties.mail.smtp.starttls.enable: true
