spring:
  application:
    name: khipu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factura}
    username: ${DB_USER:factura}
    password: ${DB_PASSWORD:factura}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
server:
  port: ${PORT:8001}
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      group:
        # Para el healthcheck de la plataforma (Railway y similares): solo lo que hace al servicio
        # inutilizable. El correo queda fuera a propósito porque es opcional (MAIL_HABILITADO=false por
        # defecto, con LogCorreoSender de fallback) y sin SMTP su indicador dejaría el deploy en DOWN
        # para siempre. `/health` completo sigue incluyendo el correo, así un SMTP roto se ve igual.
        liveness:
          include: db, ping
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui
app:
  mode: ${APP_MODE:multi}
  master-key: ${MASTER_KEY:}
  api-key-pepper: ${API_KEY_PEPPER:}
  platform-admin-key: ${PLATFORM_ADMIN_KEY:}
  jwt-secret: ${JWT_SECRET:}
  portal-url: ${PORTAL_URL:http://localhost:3000}
  storage:
    type: ${STORAGE_TYPE:fs}
    fs-root: ${STORAGE_FS_ROOT:./storage}
    # STORAGE_TYPE=s3 (#38): S3 o compatible (MinIO, Backblaze B2, Cloudflare R2). Sin endpoint → AWS; sin access-key → cadena de credenciales por defecto.
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:us-east-1}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style: ${STORAGE_S3_PATH_STYLE:false}
  integridad:
    dias: ${INTEGRIDAD_DIAS:7}
    intervalo-ms: ${INTEGRIDAD_INTERVALO_MS:86400000}
  sunat:
    timeout-seconds: ${SUNAT_TIMEOUT_SECONDS:15}
    beta-url: https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
    prod-url: https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService
    # Consultas (#36): billConsultService (estado y CDR) y billValidService (validez); solo existen en producción.
    consulta-url: https://e-factura.sunat.gob.pe/ol-it-wsconscpegem/billConsultService
    consulta-beta-url: ${SUNAT_CONSULTA_BETA_URL:}
    validez-url: https://e-factura.sunat.gob.pe/ol-it-wsconsvalidcpe/billValidService
    validez-beta-url: ${SUNAT_VALIDEZ_BETA_URL:}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:10000}
    max-intentos: ${OUTBOX_MAX_INTENTOS:20}
  mail:
    habilitado: ${MAIL_HABILITADO:false}
    remitente: ${MAIL_REMITENTE:no-responder@khipu.pe}
  zona-horaria: America/Lima
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties.mail.smtp.auth: true
  properties.mail.smtp.starttls.enable: true
