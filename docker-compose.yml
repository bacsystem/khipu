services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factura
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factura"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Storage S3 local (#38): `docker compose --profile s3 up -d minio minio-init`; minio-init crea el bucket `khipu` con versionado.
  # MinIO dejó de publicar sus imágenes en Docker Hub y Quay (oct. 2025): se usan las de Chainguard, que solo ofrecen `latest`.
  # Son distroless (sin shell ni `mc` dentro del servidor): por eso minio no tiene healthcheck, y minio-init llama a `mc`
  # directo y se reintenta (`restart: on-failure`) hasta que el servidor responda. `user: "0:0"` es solo para desarrollo
  # local: la imagen corre como 65532, que no puede escribir en el volumen /data.
  # `latest` no está fijada por digest a propósito: no se verificó que Chainguard conserve digests antiguos en su capa gratuita, y
  # uno retirado rompería el pull de golpe. Si una actualización de la imagen rompe `S3DocumentStorageTest`, `FacturaS3E2ETest` o este
  # servicio, fija el digest que funcione (`docker buildx imagetools inspect cgr.dev/chainguard/minio:latest`) en los tres sitios.
  # Lo mismo vale para `minio-client` en `minio-init` si lo que se rompe es la creación del bucket (`mb --with-versioning`); esa
  # imagen solo se usa aquí.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["s3"]
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: khipu
      MINIO_ROOT_PASSWORD: khipu-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: ["s3"]
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://khipu:khipu-minio@minio:9000
    # El versionado se activa al crear el bucket; si ya existía sin versionado, no lo cambia.
    command: ["mb", "--ignore-existing", "--with-versioning", "local/khipu"]
  portal:
    build: ./portal
    environment:
      API_BASE_URL: ${PORTAL_API_BASE_URL:-http://host.docker.internal:8001}
      # La que ve el navegador (snippets de integración, "Try it" de /developers): desde el host, la API está en localhost.
      API_PUBLIC_URL: ${PORTAL_API_PUBLIC_URL:-http://localhost:8001}
    ports: ["3000:3000"]
volumes:
  pgdata:
  miniodata:
