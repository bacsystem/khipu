services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factura
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factura"]
      interval: 5s
      timeout: 3s
      retries: 10
  portal:
    build: ./portal
    environment:
      API_BASE_URL: ${PORTAL_API_BASE_URL:-http://host.docker.internal:8080}
      # La que ve el navegador (snippets de integración, "Try it" de /developers): desde el host, la API está en localhost.
      API_PUBLIC_URL: ${PORTAL_API_PUBLIC_URL:-http://localhost:8080}
    ports: ["3000:3000"]
volumes:
  pgdata:
