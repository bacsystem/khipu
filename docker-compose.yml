services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factura
      POSTGRES_USER: factura
      POSTGRES_PASSWORD: factura
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factura"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Storage S3 local (#38): `docker compose --profile s3 up -d minio`; el bucket `khipu` se crea al arrancar.
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: khipu
      MINIO_ROOT_PASSWORD: khipu-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 khipu khipu-minio && mc mb --ignore-existing local/khipu && mc version enable local/khipu"]
  portal:
    build: ./portal
    environment:
      API_BASE_URL: ${PORTAL_API_BASE_URL:-http://host.docker.internal:8001}
      # La que ve el navegador (snippets de integración, "Try it" de /developers): desde el host, la API está en localhost.
      API_PUBLIC_URL: ${PORTAL_API_PUBLIC_URL:-http://localhost:8001}
    ports: ["3000:3000"]
volumes:
  pgdata:
  miniodata:
