# Suite de homologación contra e-beta (#32): cada noche y bajo demanda. Emite los escenarios de factura con el flujo
# completo (API → firma → XSD → SOAP) y exige CDR 0 sin observaciones; XML y CDR quedan como artifact (evidencia SUNAT).
name: Homologación e-beta

on:
  schedule:
    - cron: "0 6 * * *"   # 01:00 Lima
  # Bajo demanda. Emite con el certificado de prueba del repo (OU = 20100066603); para otro RUC hay que definir los
  # secretos HOMOLOGACION_RUC, HOMOLOGACION_CERT_B64 (PKCS#12 en base64 con OU = ese RUC) y HOMOLOGACION_CERT_CLAVE.
  workflow_dispatch:

jobs:
  homologacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Certificado propio (solo si hay secretos)
        if: ${{ secrets.HOMOLOGACION_CERT_B64 != '' }}
        env:
          HOMOLOGACION_CERT_B64: ${{ secrets.HOMOLOGACION_CERT_B64 }}
        run: echo "$HOMOLOGACION_CERT_B64" | base64 -d > "$RUNNER_TEMP/homologacion.p12"
      - name: Emitir escenarios contra e-beta
        env:
          HOMOLOGACION_RUC: ${{ secrets.HOMOLOGACION_RUC }}
          HOMOLOGACION_CERT: ${{ secrets.HOMOLOGACION_CERT_B64 != '' && format('{0}/homologacion.p12', runner.temp) || '' }}
          HOMOLOGACION_CERT_CLAVE: ${{ secrets.HOMOLOGACION_CERT_CLAVE }}
        run: ./gradlew :bootstrap:homologacion --no-daemon
      - name: Resumen
        if: always()
        run: |
          if [ -f bootstrap/build/homologacion/RESUMEN.md ]; then
            cat bootstrap/build/homologacion/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "La suite no llegó a emitir (ver log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Evidencia (XML + CDR por escenario)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacion-${{ github.run_id }}
          path: |
            bootstrap/build/homologacion/
            bootstrap/build/test-results/homologacion/
          retention-days: 90
