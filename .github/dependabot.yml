# Dependabot (CAL-02 / DEPS-03, auditoría 2026-10-22): con ~190 jars y ~900 paquetes npm, un CVE nuevo se descubría tarde. Una PR semanal por ecosistema, con las
# actualizaciones menores y de parche agrupadas para no abrir decenas de PRs.
# GitFlow: todas apuntan a `develop` (`target-branch`); sin eso las abría contra `main`, la rama por defecto, y se saltaban la integración.
# Las versiones mayores (Next 16, ESLint 10, Flyway 13, Gradle 9, Java 25, Node 26…) se ignoran: cada una se migra a mano en su propio issue, no llega sola en una
# PR semanal. Una vulnerabilidad cuya corrección sea una mayor igual aparece como alerta en la pestaña Security del repo: esa se atiende a mano.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      gradle-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, backend]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /portal
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Fijada en 0.9.67 en package.json (la de develop). Tres motivos para no subirla:
      #  - >=0.9.68 trae `undici` 7.24.4 con advisories (vía @scalar/json-magic >=0.13.5), que `npm audit` marca y 0.9.67 no tiene.
      #  - >=0.9.72, en Windows `next build --turbopack` compila las 61 páginas pero termina en «EINVAL: copyfile … [externals]_node:url_….js»
      #    al copiar a `standalone` (Windows no admite `:` en un nombre de archivo).
      #  - >=0.9.80 (probado hasta 0.9.89), su CSS rompe el build: «Parsing CSS source code failed» en un `::view-transition-group(...)` de varias líneas.
      # Quitar esta regla cuando una versión nueva compile en Windows y en la imagen y su `npm audit --omit=dev` quede sin advisories.
      - dependency-name: "@scalar/api-reference-react"
        versions: [">=0.9.68"]
    labels: [dependencies, portal]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    groups:
      acciones:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, ops]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /portal
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, portal]
    commit-message:
      prefix: build

  # Imágenes base del backend (eclipse-temurin) y del respaldo (postgres). Las mayores se ignoran como en todo el archivo; en el respaldo además porque
  # postgres tiene que seguir en la misma versión mayor que la base de Railway (deploy/README.md §8).
  - package-ecosystem: docker
    directories: [/deploy/backend, /deploy/respaldo]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, backend]
    commit-message:
      prefix: build
